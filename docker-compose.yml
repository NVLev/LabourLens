services:
  pg:
    image: postgres:16-alpine
    container_name: labour_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labour_lens}
      POSTGRES_USER: ${POSTGRES_USER:-labour_lens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labour_password_secure_123}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - labour_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labour_lens_user} -d ${POSTGRES_DB:-labour_lens}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: labour_adminer
    ports:
      - "8085:8080"
    networks:
      - labour_net
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped
  app:
    build: .
    container_name: labour_lens_app
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8003:8000"
    depends_on:
      pg:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.app_main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - labour_net
  bot:
    build: .
    container_name: labour_lens_bot
    depends_on:
      pg:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "python -m bot.bot_main"

    networks:
      - labour_net

networks:
  labour_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  hf_cache:
    driver: local

