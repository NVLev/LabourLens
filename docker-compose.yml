services:
  pg:
    image: postgres:16-alpine
    container_name: labour_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labour_lens}
      POSTGRES_USER: ${POSTGRES_USER:-labour_lens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labour_password_secure_123}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - labour_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labour_lens_user} -d ${POSTGRES_DB:-labour_lens}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: labour_adminer
    ports:
      - "8081:8080"
    networks:
      - labour_net
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped

networks:
  labour_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local